  // ==================== 工具函数 ====================
  function shuffleArray(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  // 打乱选择题选项（仅当选项数>2）
  function shuffleOptionsForChoice(q) {
    if (q.options.length > 2) {
      const newOptions = shuffleArray([...q.options]);
      return { ...q, options: newOptions };
    }
    return q;
  }

  function selectBalancedQuestions(pool, count) {
    const traitKeys = Object.keys(TRAIT_NAMES);
    const maxAttempts = 500;
    for (let attempt = 0; attempt < maxAttempts; attempt++) {
      const shuffled = shuffleArray([...pool]);
      const selected = shuffled.slice(0, count);
      const traitCounts = {};
      traitKeys.forEach(k => traitCounts[k] = 0);
      selected.forEach(q => {
        q.options.forEach(opt => {
          Object.keys(opt.scores).forEach(t => {
            if (traitCounts.hasOwnProperty(t)) traitCounts[t] += opt.scores[t];
          });
        });
      });
      const counts = Object.values(traitCounts);
      const min = Math.min(...counts);
      const max = Math.max(...counts);
      if (max - min <= 5) return selected;
    }
    return shuffleArray([...pool]).slice(0, count);
  }

  function buildQuestions(mode) {
    let choices, judges;
    if (mode === 'short') {
      choices = selectBalancedQuestions(choicePool, 10);
      judges = selectBalancedQuestions(judgePool, 3);
    } else if (mode === 'normal') {
      choices = selectBalancedQuestions(choicePool, 20);
      judges = selectBalancedQuestions(judgePool, 5);
    } else if (mode === 'full') {
      choices = selectBalancedQuestions(choicePool, 30);
      judges = selectBalancedQuestions(judgePool, 10);
    } else {
      choices = [];
      judges = [];
    }
    // 为选择题打乱选项顺序（判断题保持原样）
    const shuffledChoices = choices.map(q => shuffleOptionsForChoice(q));
    return [...shuffledChoices, ...judges];
  }

  // ==================== 状态 ====================
  let mode = null;
  let questions = [];
  let currentIndex = 0;
  let answers = [];
  let finished = false;
  const container = document.getElementById('appContainer');

  function calcTraitScores() {
    const traits = { word: 0, visual: 0, motion: 0, craft: 0, digital: 0, organ: 0, media: 0 };
    answers.forEach(ans => {
      if (ans) Object.keys(ans).forEach(t => { if (traits.hasOwnProperty(t)) traits[t] += ans[t]; });
    });
    return traits;
  }

  function calcDeptScores(traits) {
    const deptScores = {};
    Object.keys(DEPARTMENTS).forEach(deptKey => {
      const mapping = DEPT_MAPPING[deptKey];
      let score = 0;
      Object.keys(mapping).forEach(t => { score += (traits[t] || 0) * mapping[t]; });
      deptScores[deptKey] = score;
    });
    return deptScores;
  }

  function topDepts(scores) {
    const max = Math.max(...Object.values(scores));
    return max === 0 ? [] : Object.keys(scores).filter(d => scores[d] === max);
  }

  // ==================== 雷达图 ====================
  function drawRadarChart(canvasId, traitScores) {
    const canvas = document.getElementById(canvasId);
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    const W = canvas.width, H = canvas.height;
    const cx = W / 2, cy = H / 2;
    const radius = Math.min(W, H) * 0.38;
    const levels = 5;
    const traitKeys = ['word', 'visual', 'motion', 'craft', 'digital', 'organ', 'media'];
    const labels = traitKeys.map(k => TRAIT_NAMES[k]);
    const values = traitKeys.map(k => traitScores[k]);

    ctx.clearRect(0, 0, W, H);
    for (let level = 1; level <= levels; level++) {
      const r = (radius * level) / levels;
      ctx.beginPath();
      for (let i = 0; i < traitKeys.length; i++) {
        const angle = (Math.PI * 2 * i) / traitKeys.length - Math.PI / 2;
        const x = cx + r * Math.cos(angle), y = cy + r * Math.sin(angle);
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.closePath();
      ctx.strokeStyle = '#c0d5e8'; ctx.lineWidth = 1; ctx.stroke();
    }
    for (let i = 0; i < traitKeys.length; i++) {
      const angle = (Math.PI * 2 * i) / traitKeys.length - Math.PI / 2;
      const x = cx + radius * Math.cos(angle), y = cy + radius * Math.sin(angle);
      ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(x, y);
      ctx.strokeStyle = '#a0bbd4'; ctx.lineWidth = 1; ctx.stroke();
      ctx.fillStyle = '#1e4868';
      ctx.font = '10px "Segoe UI", "PingFang SC", sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      const labelRadius = radius + 18;
      ctx.fillText(labels[i], cx + labelRadius * Math.cos(angle), cy + labelRadius * Math.sin(angle));
    }
    const maxScore = Math.max(...values, 1);
    ctx.beginPath();
    for (let i = 0; i < traitKeys.length; i++) {
      const angle = (Math.PI * 2 * i) / traitKeys.length - Math.PI / 2;
      const r = (values[i] / maxScore) * radius;
      const x = cx + r * Math.cos(angle), y = cy + r * Math.sin(angle);
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.closePath();
    ctx.fillStyle = 'rgba(30, 120, 180, 0.3)'; ctx.fill();
    ctx.strokeStyle = '#1e6fa5'; ctx.lineWidth = 2; ctx.stroke();
    for (let i = 0; i < traitKeys.length; i++) {
      const angle = (Math.PI * 2 * i) / traitKeys.length - Math.PI / 2;
      const r = (values[i] / maxScore) * radius;
      const x = cx + r * Math.cos(angle), y = cy + r * Math.sin(angle);
      ctx.beginPath(); ctx.arc(x, y, 3, 0, Math.PI * 2); ctx.fillStyle = '#0b3d57'; ctx.fill();
    }
  }

  // ==================== 渲染 ====================

    document.getElementById('shortModeBtn').addEventListener('click', () => startTest('short'));
    document.getElementById('normalModeBtn').addEventListener('click', () => startTest('normal'));
    document.getElementById('fullModeBtn').addEventListener('click', () => startTest('full'));
  }

  function startTest(modeName) {
    mode = modeName;
    questions = buildQuestions(modeName);
    answers = new Array(questions.length).fill(null);
    currentIndex = 0;
    finished = false;
    render();
  }

  function render() { if (finished) { renderResult(); return; } renderQuestion(); }

  function renderQuestion() {
    const q = questions[currentIndex];
    const sel = answers[currentIndex];
    const progress = (currentIndex / questions.length) * 100;
    let optsHtml = '';
    q.options.forEach((opt, i) => {
      const letter = String.fromCharCode(65 + i);
      const isSel = sel && JSON.stringify(sel) === JSON.stringify(opt.scores);
      optsHtml += `<div class="option-btn ${isSel ? 'selected' : ''}" data-opt="${i}"><span class="option-letter">${letter}</span><span>${opt.text}</span></div>`;
    });
    const isJudge = q.options.length === 2;
    container.innerHTML = `
      <div class="detective-badge">🕵️ 案件编号 #BETI</div>
      <div class="header"><div class="logo-row">🦅🔍</div><div class="title">蓝鹰侦探局</div><div class="subtitle">${mode==='short'?'⚡ 极速侦测':(mode==='normal'?'🔎 深度侦测':'🧠 纯享侦测')} · 情报收集</div></div>
      <div class="progress-section"><div class="progress-bar-bg"><div class="progress-fill" style="width:${progress}%;"></div></div><div class="question-counter"><span>📌 情报 ${currentIndex+1}/${questions.length}</span><span>🔎 ${Math.round(progress)}%</span></div></div>
      <div class="card"><div class="question-text">${q.question}${isJudge ? ' <span style="font-size:14px;color:#888;">（判断题）</span>' : ''}</div><div class="options">${optsHtml}</div></div>
      <div class="nav-buttons">
        <button class="nav-btn" id="prevBtn" ${currentIndex===0?'disabled':''}>◂ 上一题</button>
        <button class="nav-btn" id="nextBtn" ${currentIndex===questions.length-1?'style="display:none;"':''}>下一题 ▸</button>
      </div>
      ${currentIndex===questions.length-1?`<div class="submit-area"><button class="primary-btn" id="submitBtn">🔓 生成我的特工档案</button></div>`:''}
    `;
    document.querySelectorAll('.option-btn').forEach(b => b.addEventListener('click', e => selectOption(parseInt(e.currentTarget.dataset.opt))));
    document.getElementById('prevBtn')?.addEventListener('click', () => { if (currentIndex>0) { currentIndex--; render(); } });
    document.getElementById('nextBtn')?.addEventListener('click', () => { if (currentIndex<questions.length-1) { currentIndex++; render(); } });
    document.getElementById('submitBtn')?.addEventListener('click', () => {
      const unf = answers.findIndex(a => a===null);
      if (unf!==-1) { alert(`⚠️ 还有情报未收集（第${unf+1}题）。`); currentIndex=unf; render(); return; }
      finished=true; render();
    });
  }

  function selectOption(idx) {
    answers[currentIndex] = Object.assign({}, questions[currentIndex].options[idx].scores);
    if (currentIndex < questions.length-1) { currentIndex++; render(); } else render();
  }

  function renderResult() {
    const traits = calcTraitScores();
    const deptScores = calcDeptScores(traits);
    const top = topDepts(deptScores);
    const maxDeptScore = Math.max(...Object.values(deptScores), 1);
    const order = ['edit','photo','video','draw','tech','office','ops'];
    let listHtml = '';
    order.forEach(k => {
      const d = DEPARTMENTS[k];
      const p = (deptScores[k]/maxDeptScore)*100;
      listHtml += `<div class="score-row"><span class="dept-label">${d.emoji} ${d.name}</span><div class="bar-bg"><div class="bar-fill" style="width:${p}%;"></div></div><span style="min-width:28px; text-align:right; font-weight:700;">${deptScores[k]}</span></div>`;
    });
    let recHtml = '';
    if (top.length===1) {
      const d = DEPARTMENTS[top[0]];
      recHtml = `<div class="result-badge">${d.emoji}</div><div class="dept-name">${d.name}</div><div class="dept-desc">${d.desc}</div><p style="color:#1e4868; margin-top:8px; font-weight:500;">🧬 性格特质：${d.traits}</p>`;
    } else {
      const names = top.map(k => DEPARTMENTS[k].name).join(' 与 ');
      recHtml = `<div class="result-badge">🦅✨</div><div class="dept-name">${names}</div><div class="dept-desc">你的性格特质在多个方向都有亮点！蓝鹰支持<strong>双部门</strong>，建议都了解一下。</div>`;
    }
    container.innerHTML = `
      <div class="detective-badge">📁 档案解密</div>
      <div class="header"><div class="logo-row">🦅🔓</div><div class="title">特工潜能报告</div><div class="subtitle">BETI分析完成</div></div>
      <div class="card result-card">${recHtml}</div>
      <div class="radar-container"><canvas id="radarCanvas" width="300" height="300"></canvas></div>
      <div class="score-list"><h3 style="margin:0 0 8px; color:#0a3144;">📊 部门匹配指数</h3>${listHtml}</div>
      <div style="display:flex; justify-content:center; margin-top:16px;"><button class="restart-btn" id="restartBtn">🔄 重新侦测</button></div>
      <div class="disclaimer">✨ 测试结果仅供参考，最终选择请结合自身兴趣和实际情况～</div>
      <p style="text-align:center; color:#517a94; margin-top:10px; font-size:14px;">💙 蓝鹰通讯社 · 七大部门等你加入<br>采编部 | 摄影部 | 影像部 | 手绘部 | 技术部 | 综合办公室 | 网运部</p>
    `;
    drawRadarChart('radarCanvas', traits);
    document.getElementById('restartBtn').addEventListener('click', () => {
      mode = null; questions = []; answers = []; currentIndex = 0; finished = false;
      renderEntrance();
    });
  }
