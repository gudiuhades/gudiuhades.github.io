    .radar-container { display: flex; justify-content: center; margin: 20px 0; }

  // ==================== 工具函数 ====================
  function shuffleArray(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }
  function shuffleOptionsForChoice(q) {
    if (q.options.length > 2) {
      const newOptions = shuffleArray([...q.options]);
      return { ...q, options: newOptions };
    }
    return q;
  }
  function selectBalancedQuestions(pool, count) {
    // 抽题均衡：贪心多次重启取最优 + 局部交换修复，保证任意模式下七特质覆盖差距 <= 4（模拟 3000 次全通过）
    const traitKeys = Object.keys(TRAIT_NAMES);
    function spreadOf(counts) {
      const vals = traitKeys.map(k => counts[k]);
      return Math.max(...vals) - Math.min(...vals);
    }
    function runGreedy() {
      const counts = {};
      traitKeys.forEach(k => counts[k] = 0);
      const remaining = shuffleArray([...pool]); // 先打乱保证每次题目组合不同，再贪心挑选
      const selected = [];
      while (selected.length < count) {
        let bestIdx = -1, bestScore = Infinity;
        for (let i = 0; i < remaining.length; i++) {
          const next = Object.assign({}, counts);
          remaining[i].options.forEach(opt => {
            Object.keys(opt.scores).forEach(t => { if (next.hasOwnProperty(t)) next[t] += opt.scores[t]; });
          });
          const vals = Object.values(next);
          const score = (Math.max(...vals) - Math.min(...vals)) * 1000 + Math.max(...vals);
          if (score < bestScore) { bestScore = score; bestIdx = i; }
        }
        const picked = remaining.splice(bestIdx, 1)[0];
        picked.options.forEach(opt => {
          Object.keys(opt.scores).forEach(t => { if (counts.hasOwnProperty(t)) counts[t] += opt.scores[t]; });
        });
        selected.push(picked);
      }
      return { selected, counts };
    }
    let best = null;
    for (let k = 0; k < 40; k++) {
      const trial = runGreedy();
      const s = spreadOf(trial.counts);
      if (!best || s < best.spread) best = { spread: s, selected: trial.selected, counts: trial.counts };
    }
    let selected = best.selected;
    let counts = best.counts;
    const inSel = new Set(selected);
    const unselected = pool.filter(q => !inSel.has(q));
    let improved = true, rounds = 0;
    while (improved && rounds < 200) {
      improved = false;
      for (let i = 0; i < selected.length; i++) {
        const base = Object.assign({}, counts);
        selected[i].options.forEach(opt => {
          Object.keys(opt.scores).forEach(t => { if (base.hasOwnProperty(t)) base[t] -= opt.scores[t]; });
        });
        let bestJ = -1, bestSpread = Infinity;
        for (let j = 0; j < unselected.length; j++) {
          const nxt = Object.assign({}, base);
          unselected[j].options.forEach(opt => {
            Object.keys(opt.scores).forEach(t => { if (nxt.hasOwnProperty(t)) nxt[t] += opt.scores[t]; });
          });
          const s = spreadOf(nxt);
          if (s < bestSpread) { bestSpread = s; bestJ = j; }
        }
        if (bestSpread < spreadOf(counts)) {
          const old = selected[i];
          const repl = unselected[bestJ];
          old.options.forEach(opt => {
            Object.keys(opt.scores).forEach(t => { if (counts.hasOwnProperty(t)) counts[t] -= opt.scores[t]; });
          });
          repl.options.forEach(opt => {
            Object.keys(opt.scores).forEach(t => { if (counts.hasOwnProperty(t)) counts[t] += opt.scores[t]; });
          });
          selected[i] = repl;
          unselected[bestJ] = old;
          improved = true;
        }
      }
      rounds++;
    }
    return selected;
  }

  function drawRadarChart(canvasId, traitScores) {
    const canvas = document.getElementById(canvasId);
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    const W = canvas.width, H = canvas.height;
    const cx = W / 2, cy = H / 2;
    const radius = Math.min(W, H) * 0.38;
    const levels = 5;
    const traitKeys = Object.keys(TRAIT_NAMES);
    const labels = traitKeys.map(k => TRAIT_NAMES[k]);
    const values = traitKeys.map(k => traitScores[k]);
    ctx.clearRect(0, 0, W, H);
    for (let level = 1; level <= levels; level++) {
      const r = (radius * level) / levels;
      ctx.beginPath();
      for (let i = 0; i < traitKeys.length; i++) {
        const angle = (Math.PI * 2 * i) / traitKeys.length - Math.PI / 2;
        const x = cx + r * Math.cos(angle), y = cy + r * Math.sin(angle);
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.closePath();
      ctx.strokeStyle = '#e0d3bd'; ctx.lineWidth = 1; ctx.stroke();
    }
    for (let i = 0; i < traitKeys.length; i++) {
      const angle = (Math.PI * 2 * i) / traitKeys.length - Math.PI / 2;
      const x = cx + radius * Math.cos(angle), y = cy + radius * Math.sin(angle);
      ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(x, y);
      ctx.strokeStyle = '#c8a05a'; ctx.lineWidth = 1; ctx.stroke();
      ctx.fillStyle = '#5b2c1a';
      ctx.font = '10px "Segoe UI", "PingFang SC", sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      const labelRadius = radius + 18;
      ctx.fillText(labels[i], cx + labelRadius * Math.cos(angle), cy + labelRadius * Math.sin(angle));
    }
    const maxScore = Math.max(...values, 1);
    ctx.beginPath();
    for (let i = 0; i < traitKeys.length; i++) {
      const angle = (Math.PI * 2 * i) / traitKeys.length - Math.PI / 2;
      const r = (values[i] / maxScore) * radius;
      const x = cx + r * Math.cos(angle), y = cy + r * Math.sin(angle);
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.closePath();
    ctx.fillStyle = 'rgba(184, 134, 11, 0.3)'; ctx.fill();
    ctx.strokeStyle = '#b8860b'; ctx.lineWidth = 2; ctx.stroke();
    for (let i = 0; i < traitKeys.length; i++) {
      const angle = (Math.PI * 2 * i) / traitKeys.length - Math.PI / 2;
      const r = (values[i] / maxScore) * radius;

      ctx.beginPath(); ctx.arc(x, y, 3, 0, Math.PI * 2); ctx.fillStyle = '#5b2c1a'; ctx.fill();
    }

      const dept = DEPARTMENTS[key];
      const score = deptScores[key];
      const pct = Math.round((score / maxDeptScore) * 100);
      ctx.fillStyle = '#5b2c1a';
      ctx.font = '14px "Segoe UI", "PingFang SC", sans-serif';
      ctx.fillText(`${dept.emoji} ${dept.name}`, 40, y);
      ctx.fillStyle = '#e0d3bd';
      ctx.fillRect(140, y-10, 300, 10);
      ctx.fillStyle = '#b8860b';
      ctx.fillRect(140, y-10, 300 * (pct/100), 10);
      ctx.fillStyle = '#3d2612';
      ctx.fillText(`${pct}%`, 450, y);
      y += 30;
    });
    ctx.fillStyle = '#a08860';
    ctx.font = '12px "Segoe UI", "PingFang SC", sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('蓝鹰通讯社 · BETI测试', 300, 760);
    return canvas;
  }

  // ==================== 保存分享卡片 ====================
  function saveShareCard() {
    const canvas = document.getElementById('shareCardCanvas');
    if (!canvas) return;
    const link = document.createElement('a');
    link.download = 'BETI捕快报告.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
  }

  // ==================== 复制分享链接 ====================
  function copyShareLink() {
    if (!currentResultData) return;
    const params = new URLSearchParams({ r: encodeURIComponent(JSON.stringify(currentResultData)) });
    const link = `${window.location.origin}${window.location.pathname}?${params.toString()}`;
    navigator.clipboard.writeText(link).then(() => {
      alert('链接已复制，快分享给同僚吧！');
    }).catch(() => {
      prompt('复制失败，请手动复制链接：', link);
    });
  }

  // ==================== 部门详情切换 ====================
  function toggleDeptDetails() {
    const el = document.getElementById('deptDetails');
    el.classList.toggle('show');
    if (el.classList.contains('show')) {
      const deptKeys = Object.keys(DEPARTMENTS);
      let html = '<h3 style="margin-bottom:12px;color:#3d2612;">📚 部门详细介绍</h3>';
      deptKeys.forEach(key => {
        const dept = DEPARTMENTS[key];
        html += `
          <div class="dept-detail-item">
            <div class="dept-detail-header" id="deptHeader-${key}">
              <span>${dept.emoji} ${dept.name}</span>
              <span>▼</span>
            </div>
            <div class="dept-detail-body" id="deptDetail-${key}">${dept.detail}</div>
          </div>
        `;
      });
      el.innerHTML = html;
      deptKeys.forEach(key => {
        document.getElementById(`deptHeader-${key}`).addEventListener('click', () => {
          const body = document.getElementById(`deptDetail-${key}`);
          body.classList.toggle('open');
        });
      });
    }
  }

  // ==================== 渲染入口 ====================
  function renderEntrance() {
    container.innerHTML = `
      <div class="detective-badge">🏮 案卷编号 #BETI</div>
      <div class="header"><div class="logo-row">🦅🏮</div><div class="title">蓝鹰衙门</div><div class="subtitle">📜 BETI捕快潜能测试</div></div>
      <div style="text-align:center; margin: 8px 0; color: #5b2c1a; font-weight:500;">请选择查案深度</div>
      <div class="mode-select">
        <button class="mode-btn" id="shortModeBtn">
          <span class="mode-icon">⚡</span>
          <span class="mode-text"><div class="mode-title">极速探查</div><div class="mode-desc">13题（10选择+3判断） · 约1分钟</div></span>
          <span class="arrow">›</span>
        </button>
        <button class="mode-btn" id="normalModeBtn">
          <span class="mode-icon">🔎</span>
          <span class="mode-text"><div class="mode-title">深度探查</div><div class="mode-desc">25题（20选择+5判断） · 约3分钟</div></span>
          <span class="arrow">›</span>
        </button>
        <button class="mode-btn" id="fullModeBtn">
          <span class="mode-icon">🧠</span>
          <span class="mode-text"><div class="mode-title">纯享探查</div><div class="mode-desc">40题（30选择+10判断） · 约5分钟</div></span>
          <span class="arrow">›</span>
        </button>
      </div>
      <div class="tip-line">📝 题目越多，结果越准；⚡ 极速模式仅供参考～</div>
      <p style="text-align:center; color:#8b6b3d; margin-top:16px; font-size:13px;">💡 答案没有对错，选最接近你的状态就好</p>
    `;
    document.getElementById('shortModeBtn').addEventListener('click', () => startTest('short'));
    document.getElementById('normalModeBtn').addEventListener('click', () => startTest('normal'));
    document.getElementById('fullModeBtn').addEventListener('click', () => startTest('full'));
  }

  function startTest(modeName) {
    mode = modeName;
    questions = buildQuestions(modeName);
    answers = new Array(questions.length).fill(null);
    currentIndex = 0;
    finished = false;
    currentResultData = null;
    render();
  }

  function render() { if (finished) { renderResult(); return; } renderQuestion(); }

  function renderQuestion() {
    const q = questions[currentIndex];
    const sel = answers[currentIndex];
    const progress = (currentIndex / questions.length) * 100;
    let optsHtml = '';
    q.options.forEach((opt, i) => {
      const letter = String.fromCharCode(65 + i);
      const isSel = sel && JSON.stringify(sel) === JSON.stringify(opt.scores);
      optsHtml += `<div class="option-btn ${isSel ? 'selected' : ''}" data-opt="${i}"><span class="option-letter">${letter}</span><span>${opt.text}</span></div>`;
    });
    const isJudge = q.options.length === 2;
    container.innerHTML = `
      <div class="detective-badge">🏮 案卷编号 #BETI</div>
      <div class="header"><div class="logo-row">🦅🏮</div><div class="title">蓝鹰衙门</div><div class="subtitle">${mode==='short'?'⚡ 极速探查':(mode==='normal'?'🔎 深度探查':'🧠 纯享探查')} · 线索收集</div></div>
      <div class="progress-section"><div class="progress-bar-bg"><div class="progress-fill" style="width:${progress}%;"></div></div><div class="question-counter"><span>📌 线索 ${currentIndex+1}/${questions.length}</span><span>🔦 ${Math.round(progress)}%</span></div></div>
      <div class="card"><div class="question-text">${q.question}${isJudge ? ' <span style="font-size:14px;color:#888;">（判断题）</span>' : ''}</div><div class="options">${optsHtml}</div></div>
      <div class="nav-buttons">
        <button class="nav-btn" id="prevBtn" ${currentIndex===0?'disabled':''}>◂ 上一题</button>
        <button class="nav-btn" id="nextBtn" ${currentIndex===questions.length-1?'style="display:none;"':''}>下一题 ▸</button>
      </div>
      ${currentIndex===questions.length-1?`<div class="submit-area"><button class="primary-btn" id="submitBtn">🔓 开启我的捕快档案</button></div>`:''}
    `;
    document.querySelectorAll('.option-btn').forEach(b => b.addEventListener('click', e => selectOption(parseInt(e.currentTarget.dataset.opt))));
    document.getElementById('prevBtn')?.addEventListener('click', () => { if (currentIndex>0) { currentIndex--; render(); } });
    document.getElementById('nextBtn')?.addEventListener('click', () => { if (currentIndex<questions.length-1) { currentIndex++; render(); } });
    document.getElementById('submitBtn')?.addEventListener('click', () => {
      const unf = answers.findIndex(a => a===null);
      if (unf!==-1) { alert(`⚠️ 还有线索未收集（第${unf+1}题）。`); currentIndex=unf; render(); return; }
      finished=true; render();
    });
  }

  function selectOption(idx) {
    answers[currentIndex] = Object.assign({}, questions[currentIndex].options[idx].scores);
    if (currentIndex < questions.length-1) { currentIndex++; render(); } else render();
  }

  // ==================== 渲染结果 ====================
  function renderResult() {
    let traits, deptScores, top, maxDeptScore;
    if (currentResultData) {
      traits = currentResultData.traits;
      deptScores = currentResultData.deptScores;
      top = currentResultData.top;
      maxDeptScore = currentResultData.maxDeptScore;
    } else {
      traits = calcTraitScores();
      deptScores = calcDeptScores(traits);
      top = topDepts(deptScores);
      maxDeptScore = Math.max(...Object.values(deptScores), 1);
      currentResultData = { traits, deptScores, top, maxDeptScore };
    }
    const order = ['edit','photo','video','draw','tech','office','ops'];
    let listHtml = '';
    order.forEach(k => {
      const d = DEPARTMENTS[k];
      const p = (deptScores[k]/maxDeptScore)*100;
      listHtml += `<div class="score-row"><span class="dept-label">${d.emoji} ${d.name}</span><div class="bar-bg"><div class="bar-fill" style="width:${p}%;"></div></div><span style="min-width:28px; text-align:right; font-weight:700;">${deptScores[k]}</span></div>`;
    });
    let recHtml = '';
    if (top.length===1) {
      const d = DEPARTMENTS[top[0]];
      recHtml = `<div class="result-badge">${d.emoji}</div><div class="dept-name">${d.name}</div><div class="dept-desc">${d.desc}</div><p style="color:#5b2c1a; margin-top:8px; font-weight:500;">🧬 性格特质：${d.traits}</p>`;
    } else {
      const names = top.map(k => DEPARTMENTS[k].name).join(' 与 ');
      recHtml = `<div class="result-badge">🦅✨</div><div class="dept-name">${names}</div><div class="dept-desc">你的性格特质在多个方向都有亮点！蓝鹰支持<strong>双部门</strong>，建议都了解一下。</div>`;
    }

    container.innerHTML = `
      <div class="detective-badge">📜 案卷开启</div>
      <div class="header"><div class="logo-row">🦅🔓</div><div class="title">捕快潜能报告</div><div class="subtitle">BETI分析完成</div></div>
      <div class="card result-card">${recHtml}</div>
      <div class="radar-container"><canvas id="radarCanvas" width="300" height="300"></canvas></div>
      <div class="score-list"><h3 style="margin:0 0 8px; color:#3d2612;">📊 部门匹配指数</h3>${listHtml}</div>
      <div class="share-buttons">
        <button class="share-btn" id="saveCardBtn">🖼️ 保存结果图</button>
        <button class="share-btn" id="copyLinkBtn">🔗 复制分享链接</button>
        <button class="share-btn" id="toggleDeptBtn">📚 查看部门详情</button>
      </div>
      <canvas id="shareCardCanvas" style="display:none;"></canvas>
      <div class="dept-details-container" id="deptDetails"></div>
      <div style="display:flex; justify-content:center; margin-top:16px;">
        <button class="restart-btn" id="restartBtn">🔄 重新探查</button>
      </div>
      <div class="disclaimer">✨ 测试结果仅供参考，最终选择请结合自身兴趣和实际情况～</div>
      <p style="text-align:center; color:#8b6b3d; margin-top:10px; font-size:14px;">💙 蓝鹰通讯社 · 七大部门等你加入<br>采编部 | 摄影部 | 影像部 | 手绘部 | 技术部 | 综合办公室 | 网运部</p>
    `;

    drawRadarChart('radarCanvas', traits);
    const shareCanvas = generateShareCard(traits, deptScores, top, maxDeptScore);
    const hiddenCanvas = document.getElementById('shareCardCanvas');
    hiddenCanvas.width = shareCanvas.width;
    hiddenCanvas.height = shareCanvas.height;
    hiddenCanvas.getContext('2d').drawImage(shareCanvas, 0, 0);

    document.getElementById('saveCardBtn').addEventListener('click', saveShareCard);
    document.getElementById('copyLinkBtn').addEventListener('click', copyShareLink);
    document.getElementById('toggleDeptBtn').addEventListener('click', toggleDeptDetails);
    document.getElementById('restartBtn').addEventListener('click', () => {
      mode = null; questions = []; answers = []; currentIndex = 0; finished = false;
      currentResultData = null;
      renderEntrance();
    });
  }

  // ==================== 初始化 ====================
  function init() {
    const urlParams = new URLSearchParams(window.location.search);
    const resultParam = urlParams.get('r');
    if (resultParam) {
      try {
        const data = JSON.parse(decodeURIComponent(resultParam));
        currentResultData = data;
        finished = true;
        mode = 'shared';
        renderResult();
      } catch (e) {
        renderEntrance();
      }
    } else {
      renderEntrance();
    }
  }

  init();
})();
</script>
</body>
</html>
